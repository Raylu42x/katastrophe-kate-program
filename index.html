<text class="b" x="220" y="774" font-size="38.3" textLength="236" lengthAdjust="spacingAndGlyphs"><tspan>Howdy Folks!</tspan></text>
<text class="b" x="221" y="864" font-size="38.3" textLength="1068" lengthAdjust="spacingAndGlyphs"><tspan>One of my favorite things about community theatre is watching</tspan></text>
<text class="b" x="217" y="910" font-size="38.3" textLength="963" lengthAdjust="spacingAndGlyphs"><tspan>young actors discover they&#x27;re capable of more than they</tspan></text>
<text class="b" x="217" y="956" font-size="38.3" textLength="1076" lengthAdjust="spacingAndGlyphs"><tspan>thought. Throughout this production, I&#x27;ve watched this cast take</tspan></text>
<text class="b" x="221" y="1000" font-size="38.3" textLength="1076" lengthAdjust="spacingAndGlyphs"><tspan>chances, support one another and bring so much creativity and</tspan></text>
<text class="b" x="217" y="1046" font-size="38.3" textLength="507" lengthAdjust="spacingAndGlyphs"><tspan>laughter into every rehearsal.</tspan></text>
<text class="b" x="217" y="1138" font-size="38.3" textLength="1091" lengthAdjust="spacingAndGlyphs"><tspan>I&#x27;ve always loved theatre, but directing has given me an entirely</tspan></text>
<text class="b" x="221" y="1184" font-size="38.3" textLength="1025" lengthAdjust="spacingAndGlyphs"><tspan>new appreciation for the work, courage, and teamwork that</tspan></text>
<text class="b" x="217" y="1228" font-size="38.3" textLength="1029" lengthAdjust="spacingAndGlyphs"><tspan>happen behind the curtain. Thank you to Emily for letting me</tspan></text>
<text class="b" x="217" y="1274" font-size="38.3" textLength="1095" lengthAdjust="spacingAndGlyphs"><tspan>join you on this adventure, and to Scott and Kaden for their love</tspan></text>
<text class="b" x="220" y="1320" font-size="38.3" textLength="222" lengthAdjust="spacingAndGlyphs"><tspan>and support.</tspan></text>
<text class="b" x="217" y="1410" font-size="38.3" textLength="1072" lengthAdjust="spacingAndGlyphs"><tspan>Thank you Shannon for showing me what this directing thing is</tspan></text>
<text class="b" x="221" y="1456" font-size="38.3" textLength="739" lengthAdjust="spacingAndGlyphs"><tspan>all about, I couldn&#x27;t ask for a better mentor!</tspan></text>
<text class="b" x="221" y="1548" font-size="38.3" textLength="956" lengthAdjust="spacingAndGlyphs"><tspan>And thank you to this wonderful cast, crew, families and</tspan></text>
<text class="b" x="217" y="1594" font-size="38.3" textLength="751" lengthAdjust="spacingAndGlyphs"><tspan>volunteers for trusting me with this wild tale!</tspan></text>
<text class="b" x="221" y="1684" font-size="38.3" textLength="1064" lengthAdjust="spacingAndGlyphs"><tspan>Now hold on to your hats and settle in... we got a story to tell.</tspan></text>
<text class="sig" x="208" y="1762" font-size="77.7" textLength="574" lengthAdjust="spacingAndGlyphs"><tspan>Ashley Riese, Co-Director</tspan></text>
<text class="b" x="762" y="1918" font-size="38.3" textLength="739" lengthAdjust="spacingAndGlyphs"><tspan>This production was the wild west adventure</tspan></text>
<text class="b" x="716" y="1962" font-size="38.3" textLength="786" lengthAdjust="spacingAndGlyphs"><tspan>send-off I needed. It has been magical working</tspan></text>
<text class="b" x="708" y="2008" font-size="38.3" textLength="798" lengthAdjust="spacingAndGlyphs"><tspan>with such wonderful parents and their amazing</tspan></text>
<text class="b" x="673" y="2054" font-size="38.3" textLength="836" lengthAdjust="spacingAndGlyphs"><tspan>kids in these youth productions, and this one was</tspan></text>
<text class="b" x="700" y="2100" font-size="38.3" textLength="813" lengthAdjust="spacingAndGlyphs"><tspan>no different. I have made life-long friends and it</tspan></text>
<text class="b" x="696" y="2144" font-size="38.3" textLength="813" lengthAdjust="spacingAndGlyphs"><tspan>has been an honor to direct these shows! Thank</tspan></text>
<text class="b" x="708" y="2190" font-size="38.3" textLength="805" lengthAdjust="spacingAndGlyphs"><tspan>you to my family - Darren, Rory and Ryder - for</tspan></text>
<text class="b" x="789" y="2236" font-size="38.3" textLength="724" lengthAdjust="spacingAndGlyphs"><tspan>always cheering me on and standing right</tspan></text>
<text class="b" x="700" y="2282" font-size="38.3" textLength="801" lengthAdjust="spacingAndGlyphs"><tspan>beside me, no matter the crazy and the chaos.</tspan></text>
<text class="b" x="1335" y="2372" font-size="38.3" textLength="174" lengthAdjust="spacingAndGlyphs"><tspan>Yee Haw!</tspan></text>
<text class="sig" x="890" y="2441" font-size="60.9" textLength="631" lengthAdjust="spacingAndGlyphs"><tspan>Shannon Bennett, Co-Director</tspan></text>

<text class="b" x="294" y="826" font-size="38.3" textLength="975" lengthAdjust="spacingAndGlyphs"><tspan>I was first introduced to theater three years ago when my</tspan></text>
<text class="b" x="298" y="878" font-size="38.3" textLength="1111" lengthAdjust="spacingAndGlyphs"><tspan>daughter, Eva, decided to audition for </tspan><tspan font-style="italic">Beauty and the Beast: Bed</tspan></text>
<text class="b" x="294" y="930" font-size="38.3" textLength="1126" lengthAdjust="spacingAndGlyphs"><tspan font-style="italic">and Breakfast</tspan><tspan>. Since then, our family has become part of the CCT</tspan></text>
<text class="b" x="294" y="982" font-size="38.3" textLength="1103" lengthAdjust="spacingAndGlyphs"><tspan>community, helping behind the scenes with both youth and adult</tspan></text>
<text class="b" x="298" y="1034" font-size="38.3" textLength="1114" lengthAdjust="spacingAndGlyphs"><tspan>productions. Each show gets a little easier, and each one teaches</tspan></text>
<text class="b" x="294" y="1086" font-size="38.3" textLength="1087" lengthAdjust="spacingAndGlyphs"><tspan>us something new—it&#x27;s a challenge we&#x27;ve come to really enjoy.</tspan></text>
<text class="b" x="294" y="1190" font-size="38.3" textLength="1099" lengthAdjust="spacingAndGlyphs"><tspan>Youth theater simply wouldn&#x27;t be possible without the dedication</tspan></text>
<text class="b" x="294" y="1242" font-size="38.3" textLength="1064" lengthAdjust="spacingAndGlyphs"><tspan>of our parents, and I want to thank each of them for their hard</tspan></text>
<text class="b" x="294" y="1294" font-size="38.3" textLength="1056" lengthAdjust="spacingAndGlyphs"><tspan>work, flexibility, and commitment to bringing this show to life.</tspan></text>
<text class="b" x="294" y="1346" font-size="38.3" textLength="1022" lengthAdjust="spacingAndGlyphs"><tspan>Their support is what makes this experience meaningful and</tspan></text>
<text class="b" x="298" y="1398" font-size="38.3" textLength="627" lengthAdjust="spacingAndGlyphs"><tspan>memorable for every child involved.</tspan></text>
<text class="b" x="294" y="1502" font-size="38.3" textLength="1080" lengthAdjust="spacingAndGlyphs"><tspan>Lastly, I am grateful for the opportunity to support our directors,</tspan></text>
<text class="b" x="294" y="1554" font-size="38.3" textLength="1130" lengthAdjust="spacingAndGlyphs"><tspan>Shannon and Ashley, in bringing </tspan><tspan font-style="italic">The Legend of Katastrophe Kate</tspan></text>
<text class="b" x="294" y="1606" font-size="38.3" textLength="1041" lengthAdjust="spacingAndGlyphs"><tspan>to the stage. This cast brings together a wide range of talent,</tspan></text>
<text class="b" x="294" y="1658" font-size="38.3" textLength="994" lengthAdjust="spacingAndGlyphs"><tspan>experience, and personalities. One of my favorite parts of</tspan></text>
<text class="b" x="294" y="1710" font-size="38.3" textLength="1041" lengthAdjust="spacingAndGlyphs"><tspan>working in youth theater is watching the kids grow—whether</tspan></text>
<text class="b" x="294" y="1762" font-size="38.3" textLength="1041" lengthAdjust="spacingAndGlyphs"><tspan>they&#x27;re stepping into a character for the first time or returning</tspan></text>
<text class="b" x="294" y="1814" font-size="38.3" textLength="638" lengthAdjust="spacingAndGlyphs"><tspan>year after year with new confidence.</tspan></text>
<text class="b" x="298" y="1918" font-size="38.3" textLength="809" lengthAdjust="spacingAndGlyphs"><tspan>We hope you enjoy the show - Yeee Haahhh!!!</tspan></text>
<text class="sig" x="294" y="1990" font-size="74.5" textLength="527" lengthAdjust="spacingAndGlyphs"><tspan>Jessica Blake, Producer</tspan></text>
</svg>

<text class="b" x="507" y="550" font-size="44.7" textLength="987" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Baxter Atwood</tspan><tspan> </tspan><tspan font-style="italic">(Sheriff Sam)</tspan><tspan> is appearing in his first</tspan></text>
<text class="b" x="507" y="608" font-size="44.7" textLength="1010" lengthAdjust="spacingAndGlyphs"><tspan>production with CCT. Having previously performed in</tspan></text>

<text class="b" x="507" y="1966" font-size="44.7" textLength="871" lengthAdjust="spacingAndGlyphs"><tspan>their support. Wardenseeker531 ...Peace Out!</tspan></text>
<text class="b" x="170" y="2116" font-size="44.7" textLength="1014" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Amelia Bialick</tspan><tspan> </tspan><tspan font-style="italic">(Wendy Wellington/Waltzin&#x27; Matilda)</tspan></text>

<text class="b" x="507" y="492" font-size="44.7" textLength="936" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Eva Blake</tspan><tspan> </tspan><tspan font-style="italic">(Crusty Croissant/Tumbleweed Tess)</tspan><tspan>, a</tspan></text>
<text class="b" x="507" y="550" font-size="44.7" textLength="890" lengthAdjust="spacingAndGlyphs"><tspan>spirited sixth-grader at Bellevue Christian Mack</tspan></text>

<text class="b" x="503" y="726" font-size="44.7" textLength="956" lengthAdjust="spacingAndGlyphs"><tspan>shows and contributing behind the scenes for one.</tspan></text>
<text class="b" x="507" y="784" font-size="44.7" textLength="1037" lengthAdjust="spacingAndGlyphs"><tspan>When she&#x27;s not immersed in theater, Eva can be found</tspan></text>

<text class="b" x="507" y="902" font-size="44.7" textLength="782" lengthAdjust="spacingAndGlyphs"><tspan>or spending time with friends and family.</tspan></text>
<text class="b" x="170" y="1066" font-size="44.7" textLength="929" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Cora Bolick</tspan><tspan> </tspan><tspan font-style="italic">(Lucille Fosse)</tspan><tspan> is a homeschooled 8th-</tspan></text>

<text class="b" x="170" y="1184" font-size="44.7" textLength="936" lengthAdjust="spacingAndGlyphs"><tspan>She performed most recently in the </tspan><tspan font-style="italic">Little Mermaid</tspan></text>
<text class="b" x="166" y="1242" font-size="44.7" textLength="963" lengthAdjust="spacingAndGlyphs"><tspan font-style="italic">Jr</tspan><tspan> and is looking forward to bringing her character</tspan></text>

<text class="b" x="170" y="1358" font-size="44.7" textLength="871" lengthAdjust="spacingAndGlyphs"><tspan>can find her drawing, singing, or hanging out</tspan></text>
<text class="b" x="170" y="1418" font-size="44.7" textLength="238" lengthAdjust="spacingAndGlyphs"><tspan>with friends.</tspan></text>
<text class="b" x="507" y="1566" font-size="44.7" textLength="1022" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Alaina Borjeson</tspan><tspan> </tspan><tspan font-style="italic">(Cactus Pete)</tspan><tspan> is excited to be back on</tspan></text>
<text class="b" x="503" y="1624" font-size="44.7" textLength="1033" lengthAdjust="spacingAndGlyphs"><tspan>the stage for her second CCT production! While she is</tspan></text>
<text class="b" x="507" y="1682" font-size="44.7" textLength="929" lengthAdjust="spacingAndGlyphs"><tspan>relatively new to theater, she is no stranger to the</tspan></text>
<text class="b" x="507" y="1742" font-size="44.7" textLength="913" lengthAdjust="spacingAndGlyphs"><tspan>stage, having spent many years performing as a</tspan></text>

<text class="b" x="507" y="1858" font-size="44.7" textLength="963" lengthAdjust="spacingAndGlyphs"><tspan>enjoys skiing, travelling, playing board games and</tspan></text>
<text class="b" x="507" y="1916" font-size="44.7" textLength="801" lengthAdjust="spacingAndGlyphs"><tspan>spending time with her friends and family.</tspan></text>
<text class="b" x="166" y="2204" font-size="44.7" textLength="987" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Jordan Ching</tspan><tspan> </tspan><tspan font-style="italic">(Bratwurst Parfait)</tspan><tspan> is a 4th grader who</tspan></text>
<text class="b" x="166" y="2262" font-size="44.7" textLength="952" lengthAdjust="spacingAndGlyphs"><tspan>loves the arts, math and animals. She has enjoyed</tspan></text>
<text class="b" x="170" y="2320" font-size="44.7" textLength="960" lengthAdjust="spacingAndGlyphs"><tspan>being part of </tspan><tspan font-style="italic">Katastrophe Kate</tspan><tspan>, and this is her first</tspan></text>
<text class="b" x="169" y="2380" font-size="44.7" textLength="222" lengthAdjust="spacingAndGlyphs"><tspan>production.</tspan></text>

<text class="b" x="507" y="1874" font-size="44.7" textLength="383" lengthAdjust="spacingAndGlyphs"><tspan>Community Theatre!</tspan></text>
<text class="b" x="170" y="2086" font-size="44.7" textLength="991" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Lisette Finch</tspan><tspan> </tspan><tspan font-style="italic">(Penelope Pensmore)</tspan><tspan> is back for her fifth</tspan></text>

<text class="b" x="170" y="2320" font-size="44.7" textLength="878" lengthAdjust="spacingAndGlyphs"><tspan>Lisette spends her spare time drawing, crafting</tspan></text>
<text class="b" x="166" y="2380" font-size="44.7" textLength="925" lengthAdjust="spacingAndGlyphs"><tspan>jewelry, and laughing with friends. She loves the</tspan></text>
<text class="b" x="170" y="2438" font-size="44.7" textLength="1006" lengthAdjust="spacingAndGlyphs"><tspan>energy of the CCT community and can&#x27;t wait to bring</tspan></text>
<text class="b" x="166" y="2496" font-size="44.7" textLength="565" lengthAdjust="spacingAndGlyphs"><tspan>that spark to the stage again.</tspan></text>
</svg>

<image href="pages/bg11.jpg" width="1718" height="2654"/>
<text class="b" x="170" y="576" font-size="44.7" textLength="952" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Maya Gies</tspan><tspan> </tspan><tspan font-style="italic">(Patty Paté)</tspan><tspan> is a third grader at Monroe</tspan></text>

<text class="b" x="168" y="810" font-size="44.7" textLength="244" lengthAdjust="spacingAndGlyphs"><tspan>be on stage.</tspan></text>
<text class="b" x="549" y="1096" font-size="44.7" textLength="890" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Garrison Glenn</tspan><tspan> </tspan><tspan font-style="italic">(Hans Kaput)</tspan><tspan> is 10 years old in</tspan></text>

<text class="b" x="549" y="1212" font-size="44.7" textLength="890" lengthAdjust="spacingAndGlyphs"><tspan>games, and spends time outdoors on his family</tspan></text>

<text class="b" x="170" y="1590" font-size="44.7" textLength="1006" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Westin Greene</tspan><tspan> </tspan><tspan font-style="italic">(Cathy Colander)</tspan><tspan> This is Westin&#x27;s first</tspan></text>
<text class="b" x="166" y="1650" font-size="44.7" textLength="1037" lengthAdjust="spacingAndGlyphs"><tspan>year in CCT. She is a creative and imaginative 9-year-</tspan></text>

<text class="b" x="170" y="1884" font-size="44.7" textLength="971" lengthAdjust="spacingAndGlyphs"><tspan>part of this production and share the stage with her</tspan></text>

<text class="b" x="511" y="2146" font-size="44.7" textLength="956" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Louisa Guthrie</tspan><tspan> </tspan><tspan font-style="italic">(Pauline Flambé)</tspan><tspan> This is Louisa&#x27;s 8th</tspan></text>

<text class="b" x="511" y="2380" font-size="44.7" textLength="994" lengthAdjust="spacingAndGlyphs"><tspan>thank her cats for cuddling her after long rehearsals.</tspan></text>

<text class="b" x="503" y="492" font-size="44.7" textLength="1003" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Halle Hart</tspan><tspan> </tspan><tspan font-style="italic">(Crazy Al Capulco)</tspan><tspan> is 11 years old and in</tspan></text>
<text class="b" x="503" y="550" font-size="44.7" textLength="998" lengthAdjust="spacingAndGlyphs"><tspan>5th grade at Louisa May Alcott Elementary. She likes</tspan></text>

<text class="b" x="499" y="668" font-size="44.7" textLength="1045" lengthAdjust="spacingAndGlyphs"><tspan>thing to do is to go to London and watch musicals. She</tspan></text>
<text class="b" x="503" y="726" font-size="44.7" textLength="960" lengthAdjust="spacingAndGlyphs"><tspan>also lived in Croatia for 3 years. This is Halle&#x27;s 4th</tspan></text>

<text class="b" x="503" y="844" font-size="44.7" textLength="1029" lengthAdjust="spacingAndGlyphs"><tspan font-style="italic">Mystery on 13th Street</tspan><tspan>, </tspan><tspan font-style="italic">Hard Boiled: A Nursery Crime</tspan></text>
<text class="b" x="503" y="902" font-size="44.7" textLength="944" lengthAdjust="spacingAndGlyphs"><tspan>and she played Flounder in </tspan><tspan font-style="italic">The Little Mermaid JR.</tspan></text>
<text class="b" x="170" y="1066" font-size="44.7" textLength="863" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Emily Haynes</tspan><tspan> </tspan><tspan font-style="italic">(Madame Julia Enfant)</tspan><tspan> is an 8th</tspan></text>

<text class="b" x="170" y="1184" font-size="44.7" textLength="921" lengthAdjust="spacingAndGlyphs"><tspan>production with CCT. Emily really loves being on</tspan></text>
<text class="b" x="170" y="1242" font-size="44.7" textLength="887" lengthAdjust="spacingAndGlyphs"><tspan>stage and acting, she is also involved in dance</tspan></text>
<text class="b" x="170" y="1300" font-size="44.7" textLength="899" lengthAdjust="spacingAndGlyphs"><tspan>and is a Cadette Girl Scout who enjoys leading</tspan></text>

<text class="b" x="170" y="1418" font-size="44.7" textLength="762" lengthAdjust="spacingAndGlyphs"><tspan>daughter of Steve and Daneen Haynes.</tspan></text>
<text class="b" x="507" y="1610" font-size="44.7" textLength="987" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Thalia Leite</tspan><tspan> </tspan><tspan font-style="italic">(Ivory Tickler)</tspan><tspan> is a 5th grader at the Attic</tspan></text>

<text class="b" x="507" y="1728" font-size="44.7" textLength="952" lengthAdjust="spacingAndGlyphs"><tspan>whether it&#x27;s dancing or acting and is excited to be</tspan></text>
<text class="b" x="507" y="1786" font-size="44.7" textLength="991" lengthAdjust="spacingAndGlyphs"><tspan>performing in her second performance with CCT. As</tspan></text>

<text class="b" x="170" y="2086" font-size="44.7" textLength="1002" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Bridget Mahre</tspan><tspan> </tspan><tspan font-style="italic">(Katastrophe Kate/ Katherine)</tspan><tspan> is a 8th</tspan></text>

<text class="b" x="170" y="2204" font-size="44.7" textLength="991" lengthAdjust="spacingAndGlyphs"><tspan>Bridget enjoys singing and hanging out with friends.</tspan></text>
<text class="b" x="166" y="2262" font-size="44.7" textLength="1029" lengthAdjust="spacingAndGlyphs"><tspan>This is her fourth show with CCT, and she has enjoyed</tspan></text>
<text class="b" x="166" y="2320" font-size="44.7" textLength="1018" lengthAdjust="spacingAndGlyphs"><tspan>them all, most recently having played Clara in </tspan><tspan font-style="italic">Saving</tspan></text>
<text class="b" x="170" y="2378" font-size="44.7" textLength="960" lengthAdjust="spacingAndGlyphs"><tspan font-style="italic">Serendipity</tspan><tspan>. Bridget would like to thank her family,</tspan></text>
<text class="b" x="170" y="2438" font-size="44.7" textLength="979" lengthAdjust="spacingAndGlyphs"><tspan>directors, and cast members for supporting her. She</tspan></text>
<text class="b" x="170" y="2496" font-size="44.7" textLength="689" lengthAdjust="spacingAndGlyphs"><tspan>hopes you enjoy the show! Yeehaw!</tspan></text>
</svg>

<text class="b" x="170" y="512" font-size="42.6" textLength="1002" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Aaron Marantz</tspan><tspan> </tspan><tspan font-style="italic">(Jalapeño)</tspan><tspan> is in 6th grade and this is his</tspan></text>
<text class="b" x="166" y="568" font-size="42.6" textLength="940" lengthAdjust="spacingAndGlyphs"><tspan>second production with CCT Youth. His professional</tspan></text>
<text class="b" x="170" y="622" font-size="42.6" textLength="941" lengthAdjust="spacingAndGlyphs"><tspan>experience was a weekend stint in a medieval satire</tspan></text>
<text class="b" x="170" y="678" font-size="42.6" textLength="991" lengthAdjust="spacingAndGlyphs"><tspan>movie called </tspan><tspan font-style="italic">Dorkness Falls</tspan><tspan>. He is delighted to play the</tspan></text>

<text class="b" x="170" y="788" font-size="42.6" textLength="871" lengthAdjust="spacingAndGlyphs"><tspan>allows him to display all his potential personality</tspan></text>
<text class="b" x="166" y="844" font-size="42.6" textLength="991" lengthAdjust="spacingAndGlyphs"><tspan>variances. He enjoys animals, drawing, being outside,</tspan></text>
<text class="b" x="170" y="900" font-size="42.6" textLength="898" lengthAdjust="spacingAndGlyphs"><tspan>Pokemon, baseball and parkour in his spare time.</tspan></text>
<text class="b" x="511" y="1030" font-size="42.6" textLength="1022" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Jilli Metcalf</tspan><tspan> (</tspan><tspan font-style="italic">Snakebite Sally/Svetlana</tspan><tspan>) is a 7th grader at</tspan></text>
<text class="b" x="511" y="1084" font-size="42.6" textLength="1018" lengthAdjust="spacingAndGlyphs"><tspan>Tolt Middle School and is excited to perform </tspan><tspan font-style="italic">The Legend</tspan></text>
<text class="b" x="511" y="1140" font-size="42.6" textLength="1006" lengthAdjust="spacingAndGlyphs"><tspan font-style="italic">of Katstrophe Kate</tspan><tspan>. She loves acting and has done CCT</tspan></text>
<text class="b" x="510" y="1196" font-size="42.6" textLength="902" lengthAdjust="spacingAndGlyphs"><tspan>plays since she was in 4th grade. When she&#x27;s not</tspan></text>
<text class="b" x="515" y="1250" font-size="42.6" textLength="1014" lengthAdjust="spacingAndGlyphs"><tspan>memorizing her lines, you might find her reading books,</tspan></text>
<text class="b" x="511" y="1306" font-size="42.6" textLength="1010" lengthAdjust="spacingAndGlyphs"><tspan>singing songs from various musicals, solving puzzles, or</tspan></text>
<text class="b" x="511" y="1362" font-size="42.6" textLength="1006" lengthAdjust="spacingAndGlyphs"><tspan>playing Stardew Valley. She&#x27;s excited for you to see the</tspan></text>

<text class="b" x="511" y="1472" font-size="42.6" textLength="290" lengthAdjust="spacingAndGlyphs"><tspan>enjoy the show!</tspan></text>
<text class="b" x="163" y="1604" font-size="42.6" textLength="987" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Ella Novin</tspan><tspan> </tspan><tspan font-style="italic">(Singing Chef)</tspan><tspan> is thrilled to be performing in</tspan></text>

<text class="b" x="163" y="1714" font-size="42.6" textLength="1025" lengthAdjust="spacingAndGlyphs"><tspan>performed in two previous CCT productions, </tspan><tspan font-style="italic">The Day the</tspan></text>
<text class="b" x="163" y="1770" font-size="42.6" textLength="1002" lengthAdjust="spacingAndGlyphs"><tspan font-style="italic">Internet Died</tspan><tspan> and </tspan><tspan font-style="italic">Saving Serendipity</tspan><tspan>. In her spare time,</tspan></text>

<text class="b" x="162" y="1880" font-size="42.6" textLength="987" lengthAdjust="spacingAndGlyphs"><tspan>sleeping in, and spending time with her family and her</tspan></text>
<text class="b" x="160" y="1936" font-size="42.6" textLength="159" lengthAdjust="spacingAndGlyphs"><tspan>cat, Lily.</tspan></text>
<text class="b" x="487" y="2056" font-size="42.6" textLength="1033" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Ally Pierce</tspan><tspan> (</tspan><tspan font-style="italic">Miss Lillian</tspan><tspan>) is excited to be part of this year&#x27;s</tspan></text>
<text class="b" x="484" y="2110" font-size="42.6" textLength="1025" lengthAdjust="spacingAndGlyphs"><tspan>youth theater production! You may have seen her in </tspan><tspan font-style="italic">Little</tspan></text>
<text class="b" x="488" y="2166" font-size="42.6" textLength="1018" lengthAdjust="spacingAndGlyphs"><tspan font-style="italic">Mermaid Jr., Wizard of Oz,</tspan><tspan> or </tspan><tspan font-style="italic">Chitty Chitty Bang Bang</tspan><tspan>.</tspan></text>
<text class="b" x="488" y="2222" font-size="42.6" textLength="948" lengthAdjust="spacingAndGlyphs"><tspan>She is an 8th grader at Tolt Middle School and loves</tspan></text>
<text class="b" x="487" y="2276" font-size="42.6" textLength="886" lengthAdjust="spacingAndGlyphs"><tspan>performing and being part of such a fun, creative</tspan></text>
<text class="b" x="483" y="2332" font-size="42.6" textLength="1026" lengthAdjust="spacingAndGlyphs"><tspan>community. When she&#x27;s not on stage, Ally enjoys singing</tspan></text>
<text class="b" x="488" y="2388" font-size="42.6" textLength="1041" lengthAdjust="spacingAndGlyphs"><tspan>and being around horses. She&#x27;s grateful for the support of</tspan></text>
<text class="b" x="484" y="2442" font-size="42.6" textLength="971" lengthAdjust="spacingAndGlyphs"><tspan>her family and friends and hopes you enjoy the show!</tspan></text>
<text class="b" x="484" y="2498" font-size="42.6" textLength="166" lengthAdjust="spacingAndGlyphs"><tspan>Yeehaw!</tspan></text>
</svg>

<text class="b" x="503" y="492" font-size="44.7" textLength="937" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Emily Riese</tspan><tspan> </tspan><tspan font-style="italic">(Camille Fosse)</tspan><tspan> is a 7th grader at Tolt</tspan></text>

<text class="b" x="166" y="1030" font-size="44.7" textLength="1022" lengthAdjust="spacingAndGlyphs"><tspan font-weight="600">Oren Sherman</tspan><tspan> (</tspan><tspan font-style="italic">José Habenero</tspan><tspan>) is an eighth grader at</tspan></text>

<text class="b" x="166" y="1148" font-size="44.7" textLength="979" lengthAdjust="spacingAndGlyphs"><tspan>previously, being in </tspan><tspan font-style="italic">The Purrfect Crime</tspan><tspan>, a few years</tspan></text>
<text class="b" x="166" y="1206" font-size="44.7" textLength="825" lengthAdjust="spacingAndGlyphs"><tspan>ago, </tspan><tspan font-style="italic">The Day the Internet Died</tspan><tspan>, and </tspan><tspan font-style="italic">Saving</tspan></text>
<text class="b" x="170" y="1264" font-size="44.7" textLength="1006" lengthAdjust="spacingAndGlyphs"><tspan font-style="italic">Serendipity</tspan><tspan> just last year. When Oren&#x27;s not on stage,</tspan></text>

<text class="b" x="302" y="2204" font-size="44.7" textLength="1141" lengthAdjust="spacingAndGlyphs"><tspan>A very special thank you to Hillside Academy for generously</tspan></text>
<text class="b" x="298" y="2264" font-size="44.7" textLength="1153" lengthAdjust="spacingAndGlyphs"><tspan>providing space for our rehearsals and to Tolt Middle School</tspan></text>
<text class="b" x="460" y="2322" font-size="44.7" textLength="809" lengthAdjust="spacingAndGlyphs"><tspan>for providing a stage for our performance!</tspan></text>

<text class="b" x="135" y="280" font-size="22">Special thanks to <tspan font-weight="600">Rory</tspan> <tspan font-weight="600">Bennett</tspan> for writing a significant portion</text>
<text class="b" x="135" y="313" font-size="22">of Act II, with the generous permission of the original author.</text>
<text class="b" x="135" y="346" font-size="22">Thank you, Rory, for your witty and creative storytelling—it truly</text>
<text class="b" x="135" y="379" font-size="22">elevated the show! We can’t wait to see what you write next.</text>

<text class="b" x="135" y="646" font-size="22">We also invite you to consider giving to the Andrew Sprute</text>
<text class="b" x="135" y="679" font-size="22">Youth Theater Scholarship Fund. We lost Andrew earlier this</text>
<text class="b" x="135" y="712" font-size="22">year, and all of us at CCT miss him dearly. A vital part of our</text>
<text class="b" x="135" y="745" font-size="22">Youth Program, Andrew generously volunteered his time to</text>
<text class="b" x="135" y="778" font-size="22">direct shows and help create our Intro to Theater workshop. He</text>
<text class="b" x="135" y="811" font-size="22">was an exceptional actor, director, and friend.</text>
<text class="b" x="135" y="858" font-size="22">Please scan the QR code below or visit the concessions table</text>
<text class="b" x="135" y="891" font-size="22">to contribute. Your gift honors Andrew’s legacy by helping</text>
<text class="b" x="135" y="924" font-size="22">ensure every child in our community has the opportunity to</text>
<text class="b" x="135" y="957" font-size="22">experience the magic of theater.</text>
